<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Expense Bot</title>

<link rel="stylesheet" href="style.css">

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

</head>

<body>

<div class="app">

<header class="header">

<div class="logo">

<div class="logo-icon">

💸

</div>

<div>

<h1>GHI CHI TIÊU</h1>

<p>Telegram Expense Bot</p>

</div>

</div>

<button class="setting-btn">

⚙️

</button>

</header>

<section class="card">

<h2>

Thêm giao dịch

</h2>

<div class="input-group">

<label>

NỘI DUNG

</label>

<input
id="content"
type="text"
placeholder="Ví dụ: Mua USDT">

</div>

<div class="input-group">

<label>

SỐ TIỀN

</label>

<div class="money-input">

<input
id="amount"
type="number"
placeholder="0">

<span>

VNĐ

</span>

</div>

</div>

<div class="quick-money">

<button onclick="setMoney(100000)">
100.000
</button>

<button onclick="setMoney(200000)">
200.000
</button>

<button onclick="setMoney(500000)">
500.000
</button>

<button onclick="setMoney(1000000)">
1.000.000
</button>

<button onclick="setMoney(5000000)">
5.000.000
</button>

<button onclick="setMoney(10000000)">
10.000.000
</button>

</div>

<button
class="send-btn"
onclick="sendData()">

🚀 GỬI GIAO DỊCH

</button>

</section>

<section class="summary">

<div class="summary-card">

<div class="summary-title">

HÔM NAY

</div>

<div class="summary-row">

<div>

<p>

Số giao dịch

</p>

<h2 id="count">

0

</h2>

</div>

<div>

<p>

Tổng tiền

</p>

<h2 id="total">

0

</h2>

</div>

</div>

</div>

</section>
<section class="history">

<div class="history-header">

<h2>GIAO DỊCH HÔM NAY</h2>

<button class="refresh-btn" onclick="loadToday()">

🔄

</button>

</div>

<div id="transactionList" class="transaction-list">

<div class="empty">

Chưa có giao dịch.

</div>

</div>

</section>

<section class="close-day">

<button
class="close-btn"
onclick="closeDay()">

✅ CHỐT CUỐI NGÀY

</button>

</section>

<section class="secure">

<div class="secure-icon">

✅

</div>

<div>

<h3>

Dữ liệu được gửi an toàn

</h3>

<p>

Mỗi giao dịch sẽ được lưu vào PostgreSQL
và gửi ngay đến Telegram Bot.

</p>

</div>

</section>

<nav class="bottom-nav">

<button class="active">

🏠

<span>Trang chủ</span>

</button>

<button>

📊

<span>Báo cáo</span>

</button>

<button>

🕒

<span>Lịch sử</span>

</button>

<button>

⚙️

<span>Cài đặt</span>

</button>

</nav>

</div>

<script src="script.js"></script>

</body>

</html>
