<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Telegram Expense Bot</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="phone">

<div class="card">

<div class="top">

<h1>GHI CHI TIÊU</h1>

<button class="setting">

⚙️

</button>

</div>

<div class="green-line"></div>

<label>

📝 NỘI DUNG

</label>

<textarea
id="content"
placeholder="Ví dụ: Ăn sáng"></textarea>

<label>

💰 SỐ TIỀN (VNĐ)

</label>

<div class="money-box">

<input

id="amount"

type="text"

placeholder="50.000"

autocomplete="off"

>

<button

class="clear"

onclick="clearMoney()"

type="button"

>

✕

</button>

</div>

<div class="quick">

<button onclick="setMoney(10000)">

10.000

</button>

<button onclick="setMoney(20000)">

20.000

</button>

<button onclick="setMoney(50000)">

50.000

</button>

<button onclick="setMoney(100000)">

100.000

</button>

<button onclick="document.getElementById('amount').focus()">

Khác

</button>

</div>

<button

class="send"

onclick="sendData()"

>

🚀 GỬI GIAO DỊCH

</button>

<div class="notice">

<div class="icon">

✅

</div>

<div>

<h3>

Dữ liệu được gửi an toàn đến Telegram Bot

</h3>

<p>

Nhấn "GỬI GIAO DỊCH" để lưu và gửi giao dịch.

</p>

</div>

</div>

</div>

<div class="bottom">

<div class="item active">

🏠

<span>

Trang chủ

</span>

</div>

<div class="item">

📊

<span>

Báo cáo

</span>

</div>

<div class="item">

🕘

<span>

Lịch sử

</span>

</div>

<div class="item">

⚙️

<span>

Cài đặt

</span>

</div>

</div>

</div>

<script src="app.js"></script>

</body>

</html>
