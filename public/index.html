<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Expense Bot</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<header class="header">

<h1>GHI CHI TIÊU</h1>

<button class="setting">⚙️</button>

</header>

<div class="line"></div>

<section class="card">

<label>📝 NỘI DUNG</label>

<textarea
id="content"
placeholder="Ví dụ: Ăn sáng"></textarea>

<label>💰 SỐ TIỀN (VNĐ)</label>

<div class="money">

<input
id="amount"
type="text"
placeholder="50.000">

<button
class="clear"
onclick="clearMoney()">

✕
</button>

</div>

<div class="quick">

<button onclick="setMoney(10000)">10.000</button>

<button onclick="setMoney(20000)">20.000</button>

<button onclick="setMoney(50000)">50.000</button>

<button onclick="setMoney(100000)">100.000</button>

<button onclick="amount.focus()">
Khác
</button>

</div>

<button
id="sendBtn"
class="send"
onclick="sendData()">

🚀 GỬI GIAO DỊCH

</button>

</section>

<section class="safe">

<div class="check">

✅

</div>

<div>

<h3>Dữ liệu được gửi an toàn đến Telegram Bot</h3>

<p>Nhấn "GỬI GIAO DỊCH" để lưu giao dịch.</p>

</div>

</section>

<nav class="bottom">

<div class="active">

🏠

<span>Trang chủ</span>

</div>

<div>

📊

<span>Báo cáo</span>

</div>

<div>

🕘

<span>Lịch sử</span>

</div>

<div>

⚙️

<span>Cài đặt</span>

</div>

</nav>

</div>

<script src="app.js"></script>

</body>
</html>
